[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quiclab"
version = "1.0.0"
description = "QUIC loss recovery and congestion control transport library with a discrete-event link simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "shizhihui" }]
dependencies = []

[tool.setuptools]
packages = ["quiclab", "quiclab.sim"]

[tool.pytest.ini_options]
python_version = "3.10"
testpaths = ["tests"]
